# Azure Static Web Apps CI/CD
# ---------------------------------------------------------------------------
# SUBSTITUTE BEFORE FIRST DEPLOY:
#   1. Create the Static Web App in the Azure portal (or: az staticwebapp create).
#   2. Copy its deployment token (Azure portal > your Static Web App >
#      "Deployment tokens").
#   3. Add the token to this GitHub repository as a secret named
#      AZURE_STATIC_WEB_APPS_API_TOKEN
#      (Repo > Settings > Secrets and variables > Actions > New repository secret).
#   4. If the site does NOT live at the repository root, change app_location
#      below (for example "/site"). output_location stays "" for this
#      zero-build static site.
# ---------------------------------------------------------------------------
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"    # SUBSTITUTE if the site lives in a subfolder
          api_location: ""     # no API backend; leave empty
          output_location: ""  # zero-build static site; leave empty

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
